<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil</title>
  <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>
<div class="app">
  <div class="contenido">
    <div class="caja">
      <h1>Mi perfil</h1>
      <form class="tarjeta" id="f" novalidate>
        <div class="campo"><label>Nombre</label><input id="nom" readonly></div>
        <div class="campo"><label>Cédula</label><input id="ced" readonly></div>
        <div class="campo"><label>Carrera</label><input id="car" readonly></div>
        <div class="campo"><label>Correo</label><input id="mail"></div>
        <div class="campo"><label>Teléfono</label><input id="tel"></div>
        <button>Guardar</button>
      </form>
    </div>
  </div>
</div>
<script src="../js/datos.js"></script>
<script src="../js/estudiante/perfil.js"></script>
</body>
</html>
