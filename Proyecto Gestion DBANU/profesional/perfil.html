<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil</title>
  <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>
<div class="app">
  <div class="contenido">
    <div class="caja">
      <h1>Mi perfil</h1>
      <form class="tarjeta" id="f" novalidate>
        <div class="campo"><label>Nombre</label><input id="nom" readonly></div>
        <div class="campo"><label>Área</label><input id="area" readonly></div>
        <div class="campo"><label>Correo</label><input id="mail"></div>
        <button>Guardar</button>
      </form>

      <div class="tarjeta">
        <h2>Mis citas agendadas</h2>
        <div class="tabla">
          <table>
            <thead>
              <tr><th>Fecha</th><th>Hora</th><th>Paciente</th><th>Servicio</th><th>Estado</th></tr>
            </thead>
            <tbody id="citas"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="../js/datos.js"></script>
<script src="../js/profesional/perfil.js"></script>
</body>
</html>
